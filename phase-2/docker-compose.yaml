name: obs-phase-2

# ---------------------------------------------------------------- application
services:
  order-api:
    build: ../app
    image: obs-demo-app:0.1.0
    container_name: order-api
    # -javaagent attaches the instrumentation to the JVM before main() runs.
    # Drop this one flag and you get zero spans and zero errors. That is
    # deliberate break #1.
    command:
      - java
      - -javaagent:/otel/opentelemetry-javaagent.jar
      - -XX:MaxRAMPercentage=70
      - -jar
      - /app/app.jar
    environment:
      SPRING_PROFILES_ACTIVE: api            # which half of the jar runs
      OTEL_SERVICE_NAME: order-api
      OTEL_RESOURCE_ATTRIBUTES: service.namespace=shop,deployment.environment=local,service.version=0.1.0
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otelcol:4318
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
      OTEL_TRACES_SAMPLER: always_on          # phase 6 changes this
      OTEL_LOGS_EXPORTER: otlp
      AMQP_URL: amqp://guest:guest@rabbitmq:5672
      PORT: "3001"
    ports:
      - "3001:3001"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3001/actuator/health"]
      interval: 5s
      timeout: 3s
      retries: 20
    mem_limit: 512m
    depends_on:
      rabbitmq: { condition: service_healthy }

  order-worker:
    build: ../app
    image: obs-demo-app:0.1.0
    container_name: order-worker
    command:
      - java
      - -javaagent:/otel/opentelemetry-javaagent.jar
      - -XX:MaxRAMPercentage=70
      - -jar
      - /app/app.jar
    environment:
      SPRING_PROFILES_ACTIVE: worker
      OTEL_SERVICE_NAME: order-worker        # different name — this is what the service graph draws
      OTEL_RESOURCE_ATTRIBUTES: service.namespace=shop,deployment.environment=local,service.version=0.1.0
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otelcol:4318
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
      OTEL_TRACES_SAMPLER: always_on
      OTEL_LOGS_EXPORTER: otlp
      AMQP_URL: amqp://guest:guest@rabbitmq:5672
      MONGO_URL: mongodb://mongodb:27017/shop
      S3_ENDPOINT: http://minio:9000
      APP_DETACH_CONTEXT: "false"            # set to true for deliberate break #2
    mem_limit: 512m
    depends_on:
      rabbitmq: { condition: service_healthy }
      mongodb: { condition: service_started }
      minio-init: { condition: service_completed_successfully }

  loadgen:
    image: curlimages/curl:8.18.0
    container_name: loadgen
    entrypoint: ["sh", "/loadgen.sh"]
    volumes:
      - ./loadgen.sh:/loadgen.sh:ro
    mem_limit: 32m
    depends_on:
      order-api: { condition: service_healthy }

# ------------------------------------------------------------- infrastructure
# Single node each, on purpose. Replica sets, clusters and erasure sets are
# phase 3. Nothing here is observed yet either — phase 2 only traces the
# client calls the app makes against them.
  rabbitmq:
    image: rabbitmq:4.2.0-management
    container_name: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"    # management UI, guest/guest
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
    mem_limit: 512m

  mongodb:
    image: mongo:8.2.1
    # No container_name: "mongodb" is a popular name and collides with other
    # projects' stopped containers. The compose service name is the DNS name
    # inside the network, which is all the app needs.
    command: ["--wiredTigerCacheSizeGB", "0.25"]
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    mem_limit: 512m

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: minio
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"      # console
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20
    mem_limit: 512m

  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    container_name: minio-init
    entrypoint: >
      sh -c "mc alias set local http://minio:9000 minioadmin minioadmin &&
             mc mb --ignore-existing local/receipts"
    mem_limit: 64m
    depends_on:
      minio: { condition: service_healthy }

# ------------------------------------------------------------------- pipeline
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.149.0
    container_name: otelcol
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./otel-collector-config.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - "4317:4317"
      - "4318:4318"
      - "13133:13133"
    mem_limit: 256m
    depends_on:
      - tempo
      - loki
      - prometheus

# -------------------------------------------------------- backend, unchanged
  tempo:
    image: grafana/tempo:3.0.3
    container_name: tempo
    command: ["-config.file=/etc/tempo/tempo.yaml"]
    volumes:
      - ./tempo/tempo.yaml:/etc/tempo/tempo.yaml:ro
      - tempo-data:/var/tempo
    ports:
      - "3200:3200"
    mem_limit: 512m

  loki:
    image: grafana/loki:3.7.7
    container_name: loki
    command: ["-config.file=/etc/loki/loki.yaml"]
    volumes:
      - ./loki/loki.yaml:/etc/loki/loki.yaml:ro
      - loki-data:/loki
    ports:
      - "3100:3100"
    mem_limit: 512m

  prometheus:
    image: prom/prometheus:v3.14.0
    container_name: prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--web.enable-otlp-receiver"
      - "--storage.tsdb.path=/prometheus"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    mem_limit: 512m

  grafana:
    image: grafana/grafana:13.2.1
    container_name: grafana
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "3000:3000"
    mem_limit: 512m
    depends_on:
      - tempo
      - loki
      - prometheus

volumes:
  tempo-data:
  loki-data:
  prometheus-data:
  mongo-data:
  minio-data:
