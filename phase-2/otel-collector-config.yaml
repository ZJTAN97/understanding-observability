receivers:                      # unchanged from phase 1 — the app pushes OTLP
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  memory_limiter:
    check_interval: 1s
    limit_percentage: 75
    spike_limit_percentage: 15
  batch:
    timeout: 1s

# A connector is an exporter on one pipeline and a receiver on another. This one
# consumes the trace pipeline and emits request/duration metrics per caller-callee
# edge, which is what Grafana's service map is drawn from. Traces in, metrics out
# — no application change, no extra scrape.
connectors:
  servicegraph:
    latency_histogram_buckets: [0.1s, 0.25s, 0.5s, 1s, 2s, 5s]
    store:
      # How long an unpaired client/producer span waits for its server/consumer
      # half. The SDK's BatchSpanProcessor holds spans for 5 s, so the two
      # sides of one edge routinely arrive seconds apart. The 2 s default silently
      # expires every pair and the service graph stays empty.
      ttl: 30s
      max_items: 10000

exporters:                      # identical to phase 1; the seam did not move
  otlp_grpc/tempo:
    endpoint: tempo:4317
    tls:
      insecure: true
    sending_queue:
      enabled: true
      num_consumers: 4
      queue_size: 1000
    retry_on_failure:
      enabled: true
      initial_interval: 1s
      max_interval: 10s
      max_elapsed_time: 60s

  otlp_http/loki:               # base path only — the exporter appends /v1/logs
    endpoint: http://loki:3100/otlp
    tls:
      insecure: true

  otlp_http/prometheus:
    endpoint: http://prometheus:9090/api/v1/otlp
    tls:
      insecure: true

extensions:
  health_check:
    endpoint: 0.0.0.0:13133

service:
  extensions: [health_check]
  pipelines:
    traces:
      receivers:  [otlp]
      processors: [memory_limiter, batch]
      exporters:  [otlp_grpc/tempo, servicegraph]   # fan-out: storage + the connector
    metrics:
      receivers:  [otlp, servicegraph]              # app metrics + derived edge metrics
      processors: [memory_limiter, batch]
      exporters:  [otlp_http/prometheus]
    logs:
      receivers:  [otlp]
      processors: [memory_limiter, batch]
      exporters:  [otlp_http/loki]
  telemetry:
    logs:
      level: info
