# Tempo refuses to start without this file; there is no useful default.
# Tempo 3.x replaced the ingester/compactor pair with a live-store +
# block-builder pipeline, so neither key exists any more.
server:
  http_listen_port: 3200        # Grafana queries this

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317   # default binds 127.0.0.1 — unreachable from another container

storage:
  trace:
    backend: local              # a directory in a volume; no S3, no MinIO yet
    local:
      path: /var/tempo/blocks
    wal:
      path: /var/tempo/wal
