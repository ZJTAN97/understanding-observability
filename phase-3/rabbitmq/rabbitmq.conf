# Three nodes told about each other statically. Real clusters use a discovery
# backend (k8s, consul, AWS); classic_config is the one that needs no extra
# moving part, and the peer list is the same information either way.
cluster_formation.peer_discovery_backend = classic_config
cluster_formation.classic_config.nodes.1 = rabbit@rabbitmq1
cluster_formation.classic_config.nodes.2 = rabbit@rabbitmq2
cluster_formation.classic_config.nodes.3 = rabbit@rabbitmq3

# On a partition, the side without a majority pauses itself. Quorum queues
# already behave this way; this makes the rest of the broker agree.
cluster_partition_handling = pause_minority

# guest over a non-loopback interface. Local only.
loopback_users = none

# Fire the memory alarm early so "stop the worker and watch the backlog" reaches
# a visible alarm inside a demo, not in an hour.
vm_memory_high_watermark.relative = 0.5
disk_free_limit.absolute = 200MB

# rabbitmq_prometheus, on :15692.
#   /metrics           aggregated, constant cardinality, safe to scrape often
#   /metrics/detailed  per-object, and unbounded unless you name the families
# Leaving this false is what keeps /metrics constant-cardinality as queues grow.
prometheus.return_per_object_metrics = false
