receivers:                      # unchanged from phase 0
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:                     # unchanged from phase 0
  memory_limiter:
    check_interval: 1s
    limit_percentage: 75
    spike_limit_percentage: 15
  batch:
    timeout: 1s

exporters:                      # the whole phase is this block
  otlp_grpc/tempo:              # Tempo speaks OTLP/gRPC natively. 0.149 renamed this
                                # component from "otlp"; the old alias still works but warns.
    endpoint: tempo:4317
    tls:
      insecure: true            # local only; never in production
    sending_queue:
      enabled: true
      num_consumers: 4
      queue_size: 1000
    retry_on_failure:
      enabled: true
      initial_interval: 1s
      max_interval: 10s
      max_elapsed_time: 60s

  otlp_http/loki:                # base path only — the exporter appends /v1/logs
    endpoint: http://loki:3100/otlp
    tls:
      insecure: true

  otlp_http/prometheus:          # needs --web.enable-otlp-receiver on Prometheus
    endpoint: http://prometheus:9090/api/v1/otlp
    tls:
      insecure: true

  debug:                        # kept alongside, so stdout stays a second opinion
    verbosity: basic

extensions:
  health_check:
    endpoint: 0.0.0.0:13133

service:
  extensions: [health_check]
  pipelines:
    traces:
      receivers:  [otlp]
      processors: [memory_limiter, batch]
      exporters:  [otlp_grpc/tempo, debug]
    metrics:
      receivers:  [otlp]
      processors: [memory_limiter, batch]
      exporters:  [otlp_http/prometheus, debug]
    logs:
      receivers:  [otlp]
      processors: [memory_limiter, batch]
      exporters:  [otlp_http/loki, debug]
  telemetry:
    logs:
      level: info
